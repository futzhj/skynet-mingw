name: Build Windows

on:
  push: {}
  pull_request: {}

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install MinGW toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel
            curl
            tar
            unzip
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-lz4
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-libiconv
            mingw-w64-x86_64-sqlite3
            mingw-w64-x86_64-rocksdb
            mingw-w64-x86_64-leveldb
            mingw-w64-x86_64-snappy

      - name: Prepare sources
        shell: msys2 {0}
        run: |
          set -euxo pipefail
          ./prepare.sh
          for dir in 3rd examples lualib lualib-src service service-src skynet-src test; do
            cp -R "skynet/$dir" "$dir"
          done
          cp patches/service-console.lua service/console.lua
          cp patches/mhcrypt.c lualib-src/mhcrypt.c

      - name: Build
        shell: msys2 {0}
        run: |
          set -euxo pipefail
          make
          bash tools/collect-mingw-runtime.sh

      - name: Verify build outputs
        shell: msys2 {0}
        run: |
          set -euxo pipefail
          test -f skynet.exe
          test -f skynet.dll
          test -f platform.dll
          test -f lua.exe
          test -f lua55.dll
          test -f libwinpthread-1.dll
          for module in lfs zlib lz4 lpeg cmsgpack cjson sproto openssl iconv lsqlite3 rocksdb lualeveldb; do
            test -f "luaclib/$module.so"
          done

      - name: Smoke test Lua modules
        shell: msys2 {0}
        run: |
          set -euxo pipefail
          LUA_PATH="$PWD/lualib/?.lua;$PWD/lualib/?/init.lua;;" \
          LUA_CPATH="$PWD/luaclib/?.so;;" \
            ./lua.exe tools/lua-deps-smoke.lua

      - name: Smoke test Skynet
        shell: pwsh
        run: |
          $stdout = Join-Path $env:RUNNER_TEMP 'skynet.stdout.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'skynet.stderr.log'
          $process = Start-Process -FilePath "$env:GITHUB_WORKSPACE\skynet.exe" `
            -ArgumentList 'examples\config' `
            -WorkingDirectory $env:GITHUB_WORKSPACE `
            -RedirectStandardOutput $stdout `
            -RedirectStandardError $stderr `
            -WindowStyle Hidden -PassThru
          try {
            Start-Sleep -Seconds 5
            $process.Refresh()
            $log = (Get-Content $stdout -Raw -ErrorAction SilentlyContinue) +
              (Get-Content $stderr -Raw -ErrorAction SilentlyContinue)
            if ($process.HasExited) {
              Write-Output $log
              throw "Skynet exited during startup with code $($process.ExitCode)."
            }
            if ($log -match 'assertion failed|lua call .* error') {
              Write-Output $log
              throw 'Skynet emitted a Lua service error during startup.'
            }
            foreach ($marker in @(
              'master listen socket 0.0.0.0:2013',
              'Start debug console at 127.0.0.1:8000',
              'Watchdog listen on 0.0.0.0:8888'
            )) {
              if ($log -notmatch [regex]::Escape($marker)) {
                Write-Output $log
                throw "Missing startup marker: $marker"
              }
            }
          }
          finally {
            $process.Refresh()
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
            }
          }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/skynet-manager/requirements.txt

      - name: Build GUI manager
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tools/skynet-manager/requirements.txt
          python -m PyInstaller --noconfirm --clean --onefile --windowed `
            --name SkynetManager tools/skynet-manager/main.py
          if (-not (Test-Path -LiteralPath dist/SkynetManager.exe)) {
            throw 'SkynetManager.exe was not created.'
          }

      - name: Package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = Join-Path $env:RUNNER_TEMP 'skynet-mingw'
          Remove-Item -LiteralPath $stage -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $stage | Out-Null

          $items = @(
            'skynet.exe', 'skynet.dll', 'platform.dll', 'lua.exe', 'lua55.dll',
            'libwinpthread-1.dll',
            'dist/SkynetManager.exe',
            'autotest', 'cservice', 'examples', 'lualib', 'luaclib',
            'service', 'test'
          )
          foreach ($item in $items) {
            $source = Join-Path $env:GITHUB_WORKSPACE $item
            if (Test-Path -LiteralPath $source) {
              Copy-Item -LiteralPath $source -Destination $stage -Recurse -Force
            }
          }
          Get-ChildItem -LiteralPath $env:GITHUB_WORKSPACE -Filter '*.dll' -File |
            Copy-Item -Destination $stage -Force

          Compress-Archive -Path (Join-Path $stage '*') `
            -DestinationPath (Join-Path $env:GITHUB_WORKSPACE 'skynet-mingw.zip') `
            -CompressionLevel Optimal -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: skynet-mingw
          path: skynet-mingw.zip
